version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: casper_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: casper_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_HOST=http://api:8000
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    restart: unless-stopped
