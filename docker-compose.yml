version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: casper_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: casper_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_HOST=api
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
